<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CastPlay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #player {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #imgEl {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        #videoEl {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            background: #000;
        }

        /* 初始加载/等待覆盖层 */
        #overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.6s ease;
        }

        #overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #overlay.hidden {
            display: none;
        }

        .overlay-logo {
            font-family: Arial, sans-serif;
            font-size: 52px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 4px;
            margin-bottom: 12px;
        }

        .overlay-sub {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #8b949e;
            letter-spacing: 2px;
            margin-bottom: 40px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #30363d;
            border-top-color: #1976D2;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #overlayStatus {
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: #484f58;
            margin-top: 14px;
        }

        /* 调试信息（仅开发模式下可见） */
        #debugBar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 6px 12px;
            background: rgba(0,0,0,0.7);
            color: #888;
            font-size: 11px;
            font-family: monospace;
            display: none;
            z-index: 200;
        }
    </style>
</head>
<body>
    <div id="player">
        <img id="imgEl" />
        <video id="videoEl" autoplay muted playsinline webkit-playsinline></video>

        <!-- 启动/等待覆盖层 -->
        <div id="overlay">
            <div class="overlay-logo">CastPlay</div>
            <div class="overlay-sub">智能数字标牌播放系统</div>
            <div class="spinner"></div>
            <div id="overlayStatus">正在初始化...</div>
        </div>

        <!-- 调试状态栏 -->
        <div id="debugBar" id="debugBar"></div>
    </div>

    <script>
        'use strict';

        // ────────────────────────────────────────────────
        //  全局状态
        // ────────────────────────────────────────────────
        let playlist   = null;   // 当前播放列表对象
        let currentIdx = 0;      // 当前播放项索引
        let timer      = null;   // 下一项切换定时器
        let isDebug    = false;  // 调试模式标志

        const imgEl   = document.getElementById('imgEl');
        const videoEl = document.getElementById('videoEl');
        const overlay = document.getElementById('overlay');
        const overlayStatus = document.getElementById('overlayStatus');
        const debugBar = document.getElementById('debugBar');

        // ────────────────────────────────────────────────
        //  工具函数
        // ────────────────────────────────────────────────

        /**
         * 将播放列表中的 file_url 转换为 WebView 可访问的 URL：
         *
         * asset:///xxx.svg
         *   → https://appassets.androidplatform.net/assets/xxx.svg
         *   （对应 app/src/main/assets/ 目录）
         *
         * local:///media/5_video.mp4
         *   → https://appassets.androidplatform.net/files/media/5_video.mp4
         *   （对应 context.getFilesDir() 目录）
         *
         * http:// / https://  → 直接使用
         */
        function resolveUrl(fileUrl) {
            if (!fileUrl) return '';
            if (fileUrl.startsWith('asset:///')) {
                return 'https://appassets.androidplatform.net/assets/'
                    + fileUrl.slice('asset:///'.length);
            }
            if (fileUrl.startsWith('local:///')) {
                return 'https://appassets.androidplatform.net/files/'
                    + fileUrl.slice('local:///'.length);
            }
            return fileUrl;
        }

        function setOverlayStatus(msg) {
            if (overlayStatus) overlayStatus.textContent = msg;
        }

        function hideOverlay() {
            overlay.classList.add('fade-out');
            setTimeout(() => overlay.classList.add('hidden'), 650);
        }

        function showOverlay(msg) {
            overlay.classList.remove('hidden', 'fade-out');
            if (msg) setOverlayStatus(msg);
        }

        function setDebug(msg) {
            if (isDebug) {
                debugBar.style.display = 'block';
                debugBar.textContent = msg;
            }
        }

        function clearTimer() {
            if (timer) { clearTimeout(timer); timer = null; }
        }

        // ────────────────────────────────────────────────
        //  播放逻辑
        // ────────────────────────────────────────────────

        function initPlaylist(data) {
            playlist = data;
            currentIdx = 0;

            if (!playlist || !playlist.items || playlist.items.length === 0) {
                showOverlay('暂无播放内容，等待管理后台配置...');
                return;
            }

            hideOverlay();
            playAt(0);
        }

        function playAt(index) {
            if (!playlist || !playlist.items || playlist.items.length === 0) return;
            clearTimer();

            // 循环播放
            currentIdx = ((index % playlist.items.length) + playlist.items.length)
                         % playlist.items.length;

            const item     = playlist.items[currentIdx];
            const type     = (item.media_type || 'image').toLowerCase();
            const duration = Math.max((item.display_duration || 10) * 1000, 500);
            const url      = resolveUrl(item.file_url);

            setDebug('[' + (currentIdx + 1) + '/' + playlist.items.length + '] '
                + type + ' | ' + (item.media_name || '') + ' | ' + duration + 'ms');

            if (type === 'image') {
                videoEl.pause();
                videoEl.style.display = 'none';
                videoEl.src = '';
                imgEl.style.display = 'block';
                imgEl.src = url;
                imgEl.onload = function() {
                    timer = setTimeout(() => playAt(currentIdx + 1), duration);
                };
                imgEl.onerror = function() {
                    // 图片加载失败，2 秒后切下一个
                    timer = setTimeout(() => playAt(currentIdx + 1), 2000);
                };

            } else if (type === 'video' || type === 'ppt') {
                imgEl.style.display = 'none';
                imgEl.src = '';
                videoEl.style.display = 'block';
                videoEl.src = url;

                videoEl.onloadeddata = function() {
                    videoEl.play().catch(function() {});
                };

                // 视频播放结束后切下一个
                videoEl.onended = function() {
                    clearTimer();
                    playAt(currentIdx + 1);
                };

                videoEl.onerror = function() {
                    // 视频加载失败，2 秒后切下一个
                    clearTimer();
                    timer = setTimeout(() => playAt(currentIdx + 1), 2000);
                };

                // 按时长设置最长等待（防止视频无限播放）
                timer = setTimeout(function() {
                    videoEl.pause();
                    playAt(currentIdx + 1);
                }, duration);

            } else {
                // 不支持的类型，直接跳过
                timer = setTimeout(() => playAt(currentIdx + 1), 1000);
            }
        }

        // ────────────────────────────────────────────────
        //  Android JS 接口 / 外部控制
        // ────────────────────────────────────────────────

        /**
         * 由 Android 原生调用，注入/更新播放列表 JSON 字符串
         * 也可由 WebView.evaluateJavascript 直接调用
         */
        window.loadPlaylistJson = function(jsonStr) {
            try {
                const data = JSON.parse(jsonStr);
                initPlaylist(data);
            } catch(e) {
                showOverlay('播放列表解析失败: ' + e.message);
            }
        };

        /** 停止播放 */
        window.stopPlayback = function() {
            clearTimer();
            videoEl.pause();
            imgEl.src = '';
        };

        /** 启用/禁用调试栏 */
        window.setDebugMode = function(enabled) {
            isDebug = !!enabled;
            debugBar.style.display = isDebug ? 'block' : 'none';
        };

        // ────────────────────────────────────────────────
        //  页面初始化：尝试从 Android 桥接获取播放列表
        // ────────────────────────────────────────────────
        window.addEventListener('load', function() {
            setOverlayStatus('正在加载播放列表...');

            // window.Android 是由 MainActivity 注入的 JavascriptInterface
            if (window.Android && typeof window.Android.getPlaylistJson === 'function') {
                try {
                    var json = window.Android.getPlaylistJson();
                    if (json && json.length > 10) {
                        window.loadPlaylistJson(json);
                    } else {
                        showOverlay('播放列表为空，等待同步...');
                    }
                } catch(e) {
                    showOverlay('获取播放列表异常: ' + e.message);
                }

                // 开启调试模式（仅 Debug 构建）
                if (window.Android.isDebugMode && window.Android.isDebugMode()) {
                    window.setDebugMode(true);
                }
            } else {
                // 非 Android 环境（浏览器调试用）
                showOverlay('等待 Android 环境初始化...');
            }
        });
    </script>
</body>
</html>
