<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CastPlay 播放器演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            color: #fff;
            overflow: hidden;
        }

        #player-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
        }

        #media-display {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            z-index: 100;
        }

        button {
            background: #007AFF;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        button:hover {
            background: #0051D5;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #status {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 100;
        }

        #playlist {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 12px;
            max-width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            z-index: 100;
        }

        .playlist-item {
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .playlist-item.active {
            background: #007AFF;
        }

        .playlist-item .name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .playlist-item .duration {
            font-size: 12px;
            color: #aaa;
        }

        #progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 99;
        }

        #progress {
            height: 100%;
            background: #007AFF;
            width: 0%;
            transition: width 0.5s linear;
        }

        .info-item {
            margin: 5px 0;
            font-size: 14px;
        }

        .info-label {
            color: #888;
            margin-right: 8px;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            z-index: 200;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #007AFF;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="player-container">
        <img id="media-display" class="hidden" alt="播放内容">
        <video id="video-display" class="hidden" controls></video>
        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <div>加载中...</div>
        </div>
    </div>

    <div id="status">
        <div class="info-item">
            <span class="info-label">设备ID:</span>
            <span id="device-id">DEMO-001</span>
        </div>
        <div class="info-item">
            <span class="info-label">状态:</span>
            <span id="player-status">就绪</span>
        </div>
        <div class="info-item">
            <span class="info-label">当前播放:</span>
            <span id="current-media">无</span>
        </div>
        <div class="info-item">
            <span class="info-label">时间:</span>
            <span id="current-time">--:--</span>
        </div>
    </div>

    <div id="playlist">
        <h3 style="margin-bottom: 15px;">播放列表</h3>
        <div id="playlist-items"></div>
    </div>

    <div id="controls">
        <button id="prev-btn">⏮ 上一个</button>
        <button id="play-pause-btn">▶️ 播放</button>
        <button id="next-btn">⏭ 下一个</button>
        <button id="fullscreen-btn">全屏</button>
    </div>

    <div id="progress-bar">
        <div id="progress"></div>
    </div>

    <script>
        // 播放器状态管理
        class CastPlayer {
            constructor() {
                this.currentIndex = 0;
                this.isPlaying = false;
                this.playlist = [];
                this.displayDuration = 5000; // 图片显示5秒
                this.timer = null;

                this.initElements();
                this.initDemoPlaylist();
                this.bindEvents();
            }

            initElements() {
                this.imgDisplay = document.getElementById('media-display');
                this.videoDisplay = document.getElementById('video-display');
                this.loading = document.getElementById('loading');
                this.playPauseBtn = document.getElementById('play-pause-btn');
                this.statusText = document.getElementById('player-status');
                this.currentMediaText = document.getElementById('current-media');
                this.currentTimeText = document.getElementById('current-time');
                this.progress = document.getElementById('progress');
                this.playlistContainer = document.getElementById('playlist-items');
            }

            initDemoPlaylist() {
                // 演示播放列表（使用公开图片和视频）
                this.playlist = [
                    {
                        id: 1,
                        name: '欢迎图片 1',
                        type: 'image',
                        url: 'https://picsum.photos/1920/1080?random=1',
                        duration: 5
                    },
                    {
                        id: 2,
                        name: '欢迎图片 2',
                        type: 'image',
                        url: 'https://picsum.photos/1920/1080?random=2',
                        duration: 5
                    },
                    {
                        id: 3,
                        name: '欢迎图片 3',
                        type: 'image',
                        url: 'https://picsum.photos/1920/1080?random=3',
                        duration: 5
                    },
                    {
                        id: 4,
                        name: '示例视频',
                        type: 'video',
                        url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
                        duration: 0 // 视频自动获取时长
                    }
                ];

                this.renderPlaylist();
            }

            renderPlaylist() {
                this.playlistContainer.innerHTML = this.playlist.map((item, index) => `
                    <div class="playlist-item ${index === this.currentIndex ? 'active' : ''}"
                         data-index="${index}">
                        <div class="name">${item.name}</div>
                        <div class="duration">
                            ${item.type === 'image' ? `${item.duration}秒` : '视频'}
                        </div>
                    </div>
                `).join('');

                // 绑定播放列表点击事件
                document.querySelectorAll('.playlist-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        const index = parseInt(e.currentTarget.dataset.index);
                        this.playMedia(index);
                    });
                });
            }

            bindEvents() {
                document.getElementById('play-pause-btn').addEventListener('click', () => {
                    this.togglePlayPause();
                });

                document.getElementById('prev-btn').addEventListener('click', () => {
                    this.playPrevious();
                });

                document.getElementById('next-btn').addEventListener('click', () => {
                    this.playNext();
                });

                document.getElementById('fullscreen-btn').addEventListener('click', () => {
                    this.toggleFullscreen();
                });

                // 视频播放结束自动下一个
                this.videoDisplay.addEventListener('ended', () => {
                    this.playNext();
                });

                // 视频时间更新
                this.videoDisplay.addEventListener('timeupdate', () => {
                    if (this.videoDisplay.duration) {
                        const percent = (this.videoDisplay.currentTime / this.videoDisplay.duration) * 100;
                        this.progress.style.width = percent + '%';
                    }
                });

                // 更新时间显示
                setInterval(() => {
                    this.updateTime();
                }, 1000);
            }

            togglePlayPause() {
                if (this.isPlaying) {
                    this.pause();
                } else {
                    this.play();
                }
            }

            play() {
                if (this.playlist.length === 0) return;

                this.isPlaying = true;
                this.playPauseBtn.textContent = '⏸ 暂停';
                this.statusText.textContent = '播放中';

                if (this.currentIndex >= this.playlist.length) {
                    this.currentIndex = 0;
                }

                this.playMedia(this.currentIndex);
            }

            pause() {
                this.isPlaying = false;
                this.playPauseBtn.textContent = '▶️ 播放';
                this.statusText.textContent = '已暂停';

                if (this.timer) {
                    clearTimeout(this.timer);
                    this.timer = null;
                }

                if (!this.videoDisplay.classList.contains('hidden')) {
                    this.videoDisplay.pause();
                }
            }

            playMedia(index) {
                if (index < 0 || index >= this.playlist.length) return;

                this.currentIndex = index;
                const media = this.playlist[index];

                this.loading.classList.remove('hidden');
                this.currentMediaText.textContent = media.name;

                // 隐藏所有显示元素
                this.imgDisplay.classList.add('hidden');
                this.videoDisplay.classList.add('hidden');

                if (media.type === 'image') {
                    this.playImage(media);
                } else if (media.type === 'video') {
                    this.playVideo(media);
                }

                this.renderPlaylist();
            }

            playImage(media) {
                this.imgDisplay.src = media.url;
                this.imgDisplay.onload = () => {
                    this.loading.classList.add('hidden');
                    this.imgDisplay.classList.remove('hidden');

                    // 图片显示指定时间后自动下一个
                    if (this.isPlaying) {
                        this.timer = setTimeout(() => {
                            this.playNext();
                        }, media.duration * 1000);
                    }

                    // 更新进度条
                    this.animateProgress(media.duration * 1000);
                };
            }

            playVideo(media) {
                this.videoDisplay.src = media.url;
                this.videoDisplay.onloadeddata = () => {
                    this.loading.classList.add('hidden');
                    this.videoDisplay.classList.remove('hidden');

                    if (this.isPlaying) {
                        this.videoDisplay.play();
                    }
                };
            }

            animateProgress(duration) {
                this.progress.style.width = '0%';
                this.progress.style.transition = `width ${duration}ms linear`;
                setTimeout(() => {
                    this.progress.style.width = '100%';
                }, 50);
            }

            playNext() {
                if (this.timer) {
                    clearTimeout(this.timer);
                }

                this.currentIndex = (this.currentIndex + 1) % this.playlist.length;

                if (this.isPlaying) {
                    this.playMedia(this.currentIndex);
                }
            }

            playPrevious() {
                if (this.timer) {
                    clearTimeout(this.timer);
                }

                this.currentIndex = this.currentIndex - 1;
                if (this.currentIndex < 0) {
                    this.currentIndex = this.playlist.length - 1;
                }

                if (this.isPlaying) {
                    this.playMedia(this.currentIndex);
                }
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            }

            updateTime() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                this.currentTimeText.textContent = `${hours}:${minutes}:${seconds}`;
            }
        }

        // 初始化播放器
        const player = new CastPlayer();

        // 自动播放（延迟1秒）
        setTimeout(() => {
            player.play();
        }, 1000);
    </script>
</body>
</html>
