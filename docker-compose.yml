version: '3.8'

services:
  castplay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: castplay-allinone
    ports:
      - "8000:8000"
    volumes:
      # 持久化数据库和上传文件
      - castplay-data:/app/data
    environment:
      - DATABASE_PATH=/app/data/castplay.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=false
      - NUM_WORKERS=3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  castplay-data:
    driver: local
