apiVersion: apps/v1
kind: Deployment
metadata:
  name: castplay-backend
  labels:
    app: castplay
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: castplay
      component: backend
  template:
    metadata:
      labels:
        app: castplay
        component: backend
    spec:
      containers:
        - name: backend
          image: castplay/backend:latest
          ports:
            - containerPort: 5001
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: castplay-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: castplay-secrets
                  key: secret-key
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: DEBUG
              value: "false"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: storage
              mountPath: /app/storage
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: castplay-storage

---
apiVersion: v1
kind: Service
metadata:
  name: castplay-backend
  labels:
    app: castplay
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
      name: http
  selector:
    app: castplay
    component: backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: castplay-frontend
  labels:
    app: castplay
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: castplay
      component: frontend
  template:
    metadata:
      labels:
        app: castplay
        component: frontend
    spec:
      containers:
        - name: frontend
          image: castplay/frontend:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            limits:
              memory: "128Mi"
              cpu: "100m"
            requests:
              memory: "64Mi"
              cpu: "50m"

---
apiVersion: v1
kind: Service
metadata:
  name: castplay-frontend
  labels:
    app: castplay
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: castplay
    component: frontend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: castplay
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: castplay
      component: redis
  template:
    metadata:
      labels:
        app: castplay
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              memory: "256Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: castplay
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: castplay
    component: redis

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: castplay-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/websocket-services: "castplay-backend"
spec:
  ingressClassName: nginx
  rules:
    - host: castplay.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: castplay-backend
                port:
                  number: 5001
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: castplay-backend
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: castplay-frontend
                port:
                  number: 80

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: castplay-storage
  labels:
    app: castplay
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
