[project]
name = "castplay-device-control"
version = "2.0.0"
description = "CastPlay Device Control MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
]

[project.scripts]
castplay-device-control = "device_control_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
