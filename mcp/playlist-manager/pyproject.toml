[project]
name = "castplay-playlist-manager"
version = "2.0.0"
description = "CastPlay Playlist Manager MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
]

[project.scripts]
castplay-playlist-manager = "playlist_manager_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
