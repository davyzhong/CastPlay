# Schedule API Contract

**Feature**: 001-playlist-scheduling
**Date**: 2026-03-16
**Base Path**: `/api/schedules`

## Endpoints

### List Schedules for Device

```
GET /api/schedules?device_id={device_id}
```

**Query Parameters**:
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| device_id | integer | Yes | Filter schedules by device |

**Response**: `200 OK`
```json
{
  "schedules": [
    {
      "id": 1,
      "device_id": 1,
      "playlist_id": 5,
      "playlist_name": "Morning Ads",
      "start_time": "09:00:00",
      "end_time": "12:00:00",
      "days_of_week": 31,
      "days_display": ["Mon", "Tue", "Wed", "Thu", "Fri"],
      "enabled": true,
      "priority": 0,
      "created_at": "2026-03-16T10:00:00Z",
      "updated_at": "2026-03-16T10:00:00Z"
    }
  ],
  "total": 1
}
```

### Create Schedule

```
POST /api/schedules
```

**Request Body**:
```json
{
  "device_id": 1,
  "playlist_id": 5,
  "start_time": "09:00:00",
  "end_time": "12:00:00",
  "days_of_week": 31,
  "enabled": true,
  "priority": 0
}
```

**Validation Rules**:
- `start_time` must be before `end_time`
- `days_of_week` must be between 1 and 127
- `playlist_id` must be assigned to `device_id`

**Response**: `201 Created`
```json
{
  "id": 1,
  "device_id": 1,
  "playlist_id": 5,
  "playlist_name": "Morning Ads",
  "start_time": "09:00:00",
  "end_time": "12:00:00",
  "days_of_week": 31,
  "days_display": ["Mon", "Tue", "Wed", "Thu", "Fri"],
  "enabled": true,
  "priority": 0,
  "conflicts": [],
  "created_at": "2026-03-16T10:00:00Z",
  "updated_at": "2026-03-16T10:00:00Z"
}
```

**Response with Conflicts**: `200 OK` (warning, not error)
```json
{
  "id": 2,
  "...": "...",
  "conflicts": [
    {
      "schedule_id": 1,
      "playlist_name": "Morning Ads",
      "overlap": "09:00-10:00 on Mon,Tue,Wed,Thu,Fri"
    }
  ]
}
```

**Error Response**: `400 Bad Request`
```json
{
  "detail": "start_time must be before end_time"
}
```

### Update Schedule

```
PUT /api/schedules/{schedule_id}
```

**Path Parameters**:
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| schedule_id | integer | Yes | Schedule ID to update |

**Request Body**: Same as Create

**Response**: `200 OK` (same format as Create)

### Delete Schedule

```
DELETE /api/schedules/{schedule_id}
```

**Path Parameters**:
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| schedule_id | integer | Yes | Schedule ID to delete |

**Response**: `204 No Content`

### Get Active Schedule for Device

```
GET /api/schedules/active?device_id={device_id}
```

**Query Parameters**:
| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| device_id | integer | Yes | Device ID to check |

**Response**: `200 OK`
```json
{
  "active_playlist_id": 5,
  "schedule_id": 1,
  "schedule_name": "Morning Schedule"
}
```

**Response (No Active Schedule)**: `200 OK`
```json
{
  "active_playlist_id": null,
  "schedule_id": null,
  "schedule_name": null
}
```

### Get Schedules for Player (Device Endpoint)

```
GET /api/player/{device_id}/schedules
```

**Description**: Endpoint for devices to fetch their schedule data for offline evaluation.

**Response**: `200 OK`
```json
{
  "schedules": [
    {
      "id": 1,
      "playlist_id": 5,
      "start_time": "09:00:00",
      "end_time": "12:00:00",
      "days_of_week": 31,
      "enabled": true,
      "priority": 0
    }
  ],
  "default_playlist_id": 3,
  "server_time": "2026-03-16T14:30:00Z",
  "timezone": "Asia/Shanghai"
}
```

## WebSocket Messages

### Schedule Update Notification

**Direction**: Server → Device

**Trigger**: Schedule created, updated, or deleted for this device

```json
{
  "type": "schedule_update",
  "device_id": "device-001",
  "schedules": [
    {
      "id": 1,
      "playlist_id": 5,
      "start_time": "09:00:00",
      "end_time": "12:00:00",
      "days_of_week": 31,
      "enabled": true,
      "priority": 0
    }
  ],
  "timestamp": "2026-03-16T14:30:00Z"
}
```

## Error Codes

| Code | Message | Cause |
|------|---------|-------|
| 400 | start_time must be before end_time | Invalid time range |
| 400 | playlist not assigned to device | Device-playlist mismatch |
| 404 | schedule not found | Invalid schedule_id |
| 404 | device not found | Invalid device_id |
| 422 | validation error | Missing or invalid field |
