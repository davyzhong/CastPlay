<!DOCTYPE html>
<html>
<head>
    <title>设备列表测试</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>设备列表测试</h1>
    <button onclick="fetchDevices()">获取设备列表</button>
    <div id="result"></div>

    <script>
        const API_BASE_URL = 'http://localhost:5001/api/v1';
        const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiYWRtaW4iLCJleHAiOjE3NzI2MTk0ODksImlhdCI6MTc3MjUzMzA4OSwidHlwZSI6ImFjY2VzcyJ9.UIFzqHfmZUtVb3kssolivyRpZ7r0EUjjpeykO_zYVXc';

        async function fetchDevices() {
            try {
                const response = await axios.get(`${API_BASE_URL}/devices`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                document.getElementById('result').innerHTML =
                    '<h2>设备列表:</h2><pre>' + JSON.stringify(response.data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML =
                    '<h2>错误:</h2><pre>' + JSON.stringify(error.response?.data || error.message, null, 2) + '</pre>';
            }
        }
    </script>
</body>
</html>
