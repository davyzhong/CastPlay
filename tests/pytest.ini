[pytest]
# pytest 配置文件

# 测试路径
testpaths = tests

# Python 文件匹配模式
python_files = test_*.py

# 测试类和函数匹配模式
python_classes = Test*
python_functions = test_*

# 输出选项（简化版，不启用覆盖率）
addopts =
    -v
    --showlocals
    --strict-markers
    -m "not slow"

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    e2e: 端到端测试
    performance: 性能测试
    slow: 慢速测试
    api: API 测试
    auth: 认证相关测试
    device: 设备相关测试
    media: 媒体相关测试
    playlist: 播放列表相关测试
    player: 播放端相关测试
    security: 安全测试
    asyncio: 异步测试

# 异步测试模式
asyncio_mode = auto

# 最小 Python 版本
minversion = 7.0

# 日志配置
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 警告设置
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
